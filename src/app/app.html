<div class="site-shell">
  <header class="site-header" role="banner">
    <a class="brand" routerLink="/" aria-label="YouTube Chess Search home">
      <span class="brand-mark" aria-hidden="true">
        <span class="brand-square brand-square--light"></span>
        <span class="brand-square"></span>
        <span class="brand-square"></span>
        <span class="brand-square brand-square--light"></span>
      </span>
      <span class="brand-name">YouTube Chess Search</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        >Search</a
      >
    </nav>

    <div class="header-space" aria-hidden="true"></div>
  </header>

  <div class="site-main">
    <router-outlet />
  </div>
</div>
